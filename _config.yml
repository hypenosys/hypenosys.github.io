# Site identity
title: Hypenosys
lang: es
email: ""
description: >-
  Iniciativa independiente de inteligencia artificial, software abierto y experimentación creativa.
url: "https://hypenosys.com"
repository: "hypenosys/hypenosys.github.io"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

header_pages:
  - dashboard.html

include:
  - _headers

exclude:
  - functions
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts/update_bootstrap.sh
  - test-results
