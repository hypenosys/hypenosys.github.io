name: Neural Claude API contract tests

on:
  pull_request:
    branches: [develop]
    paths:
      - 'assets/javascript/ai-config.js'
      - 'assets/javascript/neural-provider-client.js'
      - 'assets/javascript/neural-thinking-*.js'
      - '_includes/api_config_modal.html'
      - 'tests/test_anthropic_model_discovery.js'
      - 'tests/test_neural_claude_smoke.js'
      - 'tests/test_jules_claude_bridge.js'
      - 'tests/test_jules_task_handoff.js'
      - 'tests/test_jules_context_actions.js'
      - '_includes/jules-panel-styles.html'
      - 'tests/test_jules_task_supervisor.js'
      - 'assets/javascript/jules-task-supervisor.js'
      - 'assets/javascript/jules-panel-auth.js'
      - 'assets/javascript/jules-panel-repo.js'
      - 'assets/javascript/neural-chat-jules.js'
      - 'assets/javascript/neural-chat-ui.js'
      - 'assets/javascript/kanban-ui.js'
      - 'dashboard.html'
      - 'assets/javascript/jules-claude-bridge.js'
      - 'assets/javascript/jules-panel-neural.js'
      - 'assets/javascript/neural-chat-core.js'
      - 'pages/jules-panel.html'
      - 'pages/claude-chat.html'
      - 'tests/test_anthropic_pages_proxy.js'
      - 'functions/api/ai/anthropic/**'
      - 'tests/test_thinking_block*.js'
      - '.github/workflows/test-neural-claude.yml'
  push:
    branches: [develop]
    paths:
      - 'assets/javascript/ai-config.js'
      - 'assets/javascript/neural-provider-client.js'
      - 'assets/javascript/neural-thinking-*.js'
      - '_includes/api_config_modal.html'
      - 'tests/test_anthropic_model_discovery.js'
      - 'tests/test_neural_claude_smoke.js'
      - 'tests/test_jules_claude_bridge.js'
      - 'tests/test_jules_task_handoff.js'
      - 'tests/test_jules_context_actions.js'
      - '_includes/jules-panel-styles.html'
      - 'tests/test_jules_task_supervisor.js'
      - 'assets/javascript/jules-task-supervisor.js'
      - 'assets/javascript/jules-panel-auth.js'
      - 'assets/javascript/jules-panel-repo.js'
      - 'assets/javascript/neural-chat-jules.js'
      - 'assets/javascript/neural-chat-ui.js'
      - 'assets/javascript/kanban-ui.js'
      - 'dashboard.html'
      - 'assets/javascript/jules-claude-bridge.js'
      - 'assets/javascript/jules-panel-neural.js'
      - 'assets/javascript/neural-chat-core.js'
      - 'pages/jules-panel.html'
      - 'pages/claude-chat.html'
      - 'tests/test_anthropic_pages_proxy.js'
      - 'functions/api/ai/anthropic/**'
      - 'tests/test_thinking_block*.js'
      - '.github/workflows/test-neural-claude.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Anthropic discovery (mocked)
        run: node tests/test_anthropic_model_discovery.js
      - name: Claude native Messages and SSE (mocked)
        run: node tests/test_neural_claude_smoke.js
      - name: Cloudflare Anthropic relay contracts (mocked)
        run: node tests/test_anthropic_pages_proxy.js
      - name: Jules and Claude bridge guardrails
        run: node tests/test_jules_claude_bridge.js
      - name: Dashboard to Jules to Claude handoff contracts
        run: node tests/test_jules_task_handoff.js
      - name: HAIS task supervisor approval and organizational boundary tests
        run: node tests/test_jules_task_supervisor.js
      - name: Syntax checks for Neural, Jules and routing scripts
        run: |
          node --check assets/javascript/jules-panel-auth.js
          node --check assets/javascript/jules-panel-repo.js
          node --check assets/javascript/jules-panel-neural.js
          node --check assets/javascript/neural-chat-jules.js
          node --check assets/javascript/neural-chat-ui.js
          node --check assets/javascript/jules-claude-bridge.js
          node --check assets/javascript/jules-task-supervisor.js
          node --check assets/javascript/kanban-ui.js
      - name: Jules panel contextual actions and partial quote safety
        run: node tests/test_jules_context_actions.js
      - name: AI provider config
        run: node tests/test_api_config.js
      - name: Thinking adapter regressions
        run: |
          for file in tests/test_thinking_block*.js; do node "$file"; done
