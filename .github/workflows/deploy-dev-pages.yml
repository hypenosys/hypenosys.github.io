name: Deploy Hypenosys Pages (dev)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypenosys-dev-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node for Neural Chat contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Anthropic discovery, native Messages and Cloudflare relay
        run: |
          node tests/test_anthropic_model_discovery.js
          node tests/test_neural_claude_smoke.js
          node tests/test_anthropic_pages_proxy.js
          node tests/test_jules_claude_bridge.js
          node tests/test_jules_task_handoff.js
          node tests/test_jules_context_actions.js
          node tests/test_jules_task_supervisor.js
          node --check assets/javascript/jules-task-supervisor.js
          node --check assets/javascript/jules-claude-bridge.js
          node --check assets/javascript/jules-panel-auth.js
          node --check assets/javascript/jules-panel-neural.js
          node --check assets/javascript/neural-chat-jules.js
          node --check assets/javascript/neural-chat-ui.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --source . --destination ./_site --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./_site --project-name=hypenosys-dev --branch=develop

      - name: Verify deployed Anthropic relay answers without a key
        run: |
          # Expected 401 from the Pages Function; HTML 200/404 means the function route is missing.
          for i in {1..8}; do
            status="$(curl --silent --show-error --max-time 10 \
              -o /tmp/anthropic-relay-response.json -w '%{http_code}' \
              'https://dev.hypenosys.com/api/ai/anthropic/models' || true)"
            if [ "$status" = "401" ] && grep -q 'authentication_error' /tmp/anthropic-relay-response.json; then
              echo 'Anthropic Cloudflare Pages relay is reachable (unauthenticated 401 as expected).'
              exit 0
            fi
            echo "Relay not ready yet (HTTP ${status:-network_error}); retry ${i}/8"
            sleep 5
          done
          echo 'Relay health check failed: expected HTTP 401 JSON from /api/ai/anthropic/models.'
          exit 1

      - name: Verify live Cloudflare-to-Anthropic upstream with a dummy credential
        run: |
          # No real secret is used; a syntactically plausible but invalid key must
          # reach Anthropic and return its authentication error, not a proxy 502.
          # This specifically catches Cloudflare's unsupported redirect: error mode.
          for i in {1..8}; do
            status="$(curl --silent --show-error --max-time 12 \
              -H 'Authorization: Bearer sk-ant-test-deliberately-invalid-000000000000' \
              -o /tmp/anthropic-upstream-response.json -w '%{http_code}' \
              'https://dev.hypenosys.com/api/ai/anthropic/models?limit=1' || true)"
            if [ "$status" = "401" ] && grep -q 'authentication_error' /tmp/anthropic-upstream-response.json; then
              echo 'Anthropic upstream reachable via Cloudflare (expected rejection of invalid test key).'
              exit 0
            fi
            echo "Anthropic upstream probe did not get a 401 (HTTP ${status:-network_error}), attempt ${i}/8"
            sleep 5
          done
          echo 'Claude relay upstream probe failed. No valid keys were used.'
          exit 1

