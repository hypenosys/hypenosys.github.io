name: HAIS pilot contract
on:
  pull_request:
    paths:
      - 'pilot/hais-001/**'
      - '.github/workflows/hais-pilot.yml'
  push:
    branches: [master]
    paths:
      - 'pilot/hais-001/**'
      - '.github/workflows/hais-pilot.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HAIS pilot dependency graph and live-trading gate
        run: python pilot/hais-001/validate.py
